name: Unit tests

# Tests/LootScavenging.Tests compiles Source/Model directly and needs no RimWorld assemblies, so it runs on a plain runner.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet test LootScavenging.Tests.sln --nologo
